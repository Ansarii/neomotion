[versions]
agp                   = "8.7.3"
kotlin                = "2.1.0"
ksp                   = "2.1.0-1.0.29"
compose-bom           = "2025.01.01"
compose-compiler      = "1.5.15"
activity-compose      = "1.9.3"
navigation-compose    = "2.8.9"
lifecycle             = "2.8.7"
material3             = "1.3.2"
material3-adaptive    = "1.1.0"
window                = "1.3.0"
coroutines            = "1.9.0"
hilt                  = "2.53.1"
hilt-navigation       = "1.2.0"
junit                 = "4.13.2"
junit-ext             = "1.2.1"
espresso              = "3.6.1"
coil                  = "2.7.0"
credentials           = "1.5.0-beta01"

[libraries]
# Compose BOM
compose-bom                     = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest        = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4          = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-animation               = { group = "androidx.compose.animation", name = "animation" }           # SeekableTransitionState stable
compose-foundation              = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime                 = { group = "androidx.compose.runtime", name = "runtime" }
compose-material3               = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material3-adaptive      = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3-adaptive" }

# Activity
activity-compose                = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }  # PredictiveBackHandler, enableEdgeToEdge

# Navigation
navigation-compose              = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }  # predictivePopEnterTransition

# Lifecycle + ViewModel
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Window / Foldable
window                          = { group = "androidx.window", name = "window", version.ref = "window" }  # FoldingFeature, WindowInfoTracker

# Coroutines
coroutines-android              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# DI — Hilt
hilt-android                    = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }

# Image loading
coil-compose                    = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Material Icons Extended
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Identity & Credentials
credentials                     = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play-services-auth  = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# Testing
junit                           = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext                       = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
espresso-core                   = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application             = { id = "com.android.application", version.ref = "agp" }
android-library                 = { id = "com.android.library", version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                            = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                             = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
compose-core      = ["compose-ui", "compose-animation", "compose-foundation", "compose-runtime",
                      "compose-ui-tooling-preview", "compose-material3",
                      "compose-material-icons-extended"]
lifecycle         = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]
